name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npx prisma generate
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cp app.env.example app.env
      - run: flutter pub get
      - run: flutter analyze
