name: Nightly DB Backup

on:
  schedule:
    - cron: '0 20 * * *' # 20:00 UTC daily
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # pg_dump must be the same version or newer than the server (Neon runs
      # whatever Postgres major version is current — 18 as of this writing).
      # Ubuntu's own repo lags behind, and pinning a specific version here
      # (we tried 17) just goes stale on Neon's next upgrade — the unversioned
      # `postgresql-client` metapackage from PGDG always resolves to latest.
      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        run: |
          set -euo pipefail
          FILENAME="backup-$(date +%Y-%m-%d).sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "$FILENAME"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload to R2
        run: |
          aws s3 cp "$FILENAME" "s3://$R2_BUCKET/$FILENAME" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # Keeps storage bounded regardless of how long this workflow runs
      # unattended — R2 has no hard spending cap, only after-the-fact email
      # alerts, so pruning is the actual safeguard, not just tidiness.
      - name: Delete backups older than 30 days
        run: |
          set -euo pipefail
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          CUTOFF=$(date -d '30 days ago' +%Y-%m-%d)
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$ENDPOINT" | awk '{print $4}' | while read -r key; do
            [ -z "$key" ] && continue
            file_date=$(echo "$key" | grep -oP '\d{4}-\d{2}-\d{2}' || true)
            if [ -n "$file_date" ] && [[ "$file_date" < "$CUTOFF" ]]; then
              echo "Deleting old backup: $key"
              aws s3 rm "s3://$R2_BUCKET/$key" --endpoint-url "$ENDPOINT"
            fi
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
